pluginManagement {
    repositories {
        google()
        // Mirror of Maven Central - avoids HTTP 429 rate limits on JitPack
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        // Mirror of Maven Central - avoids HTTP 429 rate limits on JitPack
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

rootProject.name = "UmangSdk"
include ':app'
include ':umangWebView'