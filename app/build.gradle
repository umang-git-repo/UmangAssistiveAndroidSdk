plugins {
    id 'com.android.application'
//    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.negd.umangsdk'
    compileSdk 36

    defaultConfig {
        applicationId "com.negd.umangsdk"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

//    dataBinding {
//        enabled = true
//    }
//
//    viewBinding{
//        enabled=true
//    }
    buildFeatures {
        dataBinding true
        viewBinding true
    }
   // buildFeatures { dataBinding = true }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation project(path: ':umangWebView')
//    implementation 'com.github.umang-git-repo:UmangAssistiveAndroidSdk:1.2.1'
//    implementation 'com.github.umang-git-repo:UmangAssistiveAndroidSdk:1.0.24'
    //implementation files('C:\\Users\\Daffolap-674\\Documents\\Umang_Sdk\\app\\libs\\UmangAssistiveSdk.aar')


}