plugins {
    id 'com.android.library'
    id 'maven-publish'
}



android {
    namespace 'com.negd.umangwebview'
    compileSdk 36

    defaultConfig {
        minSdk 29
        targetSdk 36
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes.all {
        buildConfigField "String", "VERSION_NAME", "\"1.3.3\"" // Escaping quote marks to convert property to String
        buildConfigField "int", "VERSION_CODE", "42"
    }

    buildTypes {
        release {
            // Do not minify the library itself: R8 renames the public API
            // (UmangAssistiveAndroidSdk, IUmangAssistiveListener...) to a, b, c
            // and integrators get "Unresolved reference". Shrinking is left to the
            // consuming app, which picks up consumer-rules.pro.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        dataBinding false
        viewBinding true
    }

    libraryVariants.configureEach { variant ->
        variant.outputs.all {
            // Each variant MUST have a unique file name. If debug and release both
            // write "UmangAssistiveSdk.aar", Gradle 8.x fails the publish task
            // (generateMetadataFileForReleasePublication) with an implicit-dependency error.
            outputFileName = variant.buildType.name == "release" ?
                    "UmangAssistiveSdk.aar" :
                    "UmangAssistiveSdk-${variant.buildType.name}.aar"
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    //web view
    implementation 'com.github.Justson.AgentWeb:agentweb-core:v5.0.6-androidx'
    implementation 'com.github.Justson.AgentWeb:agentweb-filechooser:v5.0.6-androidx'
    implementation 'com.github.Justson:Downloader:v5.0.4-androidx'
    //ios parser library for audio
    implementation 'com.googlecode.mp4parser:isoparser:1.1.22'
    // parser
    implementation "com.google.code.gson:gson:2.11.0"
    //image cropper
//    implementation 'com.theartofdev.edmodo:android-image-cropper:2.8.0'
    implementation 'com.vanniktech:android-image-cropper:4.6.0'

    //compressorzacx
    implementation 'id.zelory:compressor:2.1.1'
    //google location service
    //noinspection GradleCompatible
    //implementation files('libs/play-services-location-17.0.0.aar')
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    //multi-dex
    implementation "com.android.support:multidex:1.0.3"
    //okhttp client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // logger
    implementation "com.jakewharton.timber:timber:5.0.1"
    //jsoup librayr
    implementation 'org.jsoup:jsoup:1.18.3'
    // image glide
    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.github.umang-git-repo'
                artifactId = 'UmangAssistiveAndroidSdk'
                version = '1.3.3'
            }
        }
    }
}