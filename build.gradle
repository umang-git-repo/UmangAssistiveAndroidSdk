// Top-level build file where you can add configuration options common to all sub-projects/modules.
// NOTE: Repositories are declared ONLY in settings.gradle (dependencyResolutionManagement).
// Do not add an allprojects { repositories { ... } } block here - it conflicts with
// RepositoriesMode.FAIL_ON_PROJECT_REPOS and breaks the build.

plugins {
    id 'com.android.application' version '8.13.0' apply false
    id 'com.android.library' version '8.13.0' apply false
}
tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}